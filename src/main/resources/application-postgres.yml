spring:
  profiles: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/raindb}
    username: ${SPRING_DATASOURCE_USERNAME:rain}
    password: ${SPRING_DATASOURCE_PASSWORD:rainpass}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
