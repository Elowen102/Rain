version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: raindb
      POSTGRES_USER: rain
      POSTGRES_PASSWORD: rainpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/raindb
      SPRING_DATASOURCE_USERNAME: rain
      SPRING_DATASOURCE_PASSWORD: rainpass
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  pgdata:
